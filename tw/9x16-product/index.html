<!doctype html>
<!-- 台灣版範本：9:16 產品介紹（15 秒）| HyperFrames 台灣版 fork -->
<!-- 用法：把 <!-- 產品圖 --> 處的 <div class="product-card"> 換成你自己的產品照片 -->
<!-- <img src="你的產品照.jpg" alt="產品">，照片請用官方圖，不要用 AI 生成的產品圖。 -->
<!-- 畫面內所有文字都是 HTML 疊加，模型不畫中文字。 -->
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>產品介紹 9:16</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1080px; height: 1920px; overflow: hidden;
        background: #101014;
        font-family: "Noto Sans TC", sans-serif;
      }
      .scene { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
      /* 安全區：上方留 180px（帳號列），下方留 320px（按讚、留言、字幕區），文字只放中間 300–1420px */
      .safe { position: absolute; top: 300px; left: 80px; right: 80px; height: 1120px; }
      .eyebrow { color: #8b7cff; font-size: 44px; font-weight: 700; letter-spacing: 6px; }
      .title { color: #fff; font-size: 110px; font-weight: 900; line-height: 1.25; margin-top: 28px; }
      .product-card {
        margin-top: 56px; height: 520px; border-radius: 36px;
        background: linear-gradient(160deg, #4823ff, #7a5cff 55%, #2b2b33);
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 52px; font-weight: 700; text-align: center; line-height: 1.5;
      }
      .points { margin-top: 48px; color: #e8e8ee; font-size: 48px; font-weight: 500; line-height: 1.9; }
      .points b { color: #fff; }
      .cta {
        position: absolute; left: 80px; right: 80px; bottom: 360px;
        background: #fff; color: #101014; border-radius: 999px;
        font-size: 52px; font-weight: 900; text-align: center; padding: 34px 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="tw-9x16-product"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <div class="scene">
        <div class="safe">
          <div class="eyebrow" id="eyebrow">新品上市</div>
          <div class="title" id="title">好東西，<br />值得被看見。</div>
          <!-- 產品圖：把下面這個色塊換成你自己的產品照片（img，width 100%、object-fit cover） -->
          <div class="product-card" id="product">你的產品照片<br />放在這裡</div>
          <div class="points" id="points">✓ 第一個賣點，寫給客人看<br />✓ 第二個賣點，只寫真的<br />✓ 第三個賣點，寫客人最在意的事</div>
        </div>
        <div class="cta" id="cta">了解更多</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#eyebrow", { opacity: 0, y: 30, duration: 0.6, ease: "power3.out" }, 0);
      tl.from("#title", { opacity: 0, y: 60, duration: 0.8, ease: "power3.out" }, 0.4);
      tl.from("#product", { opacity: 0, scale: 0.94, duration: 0.8, ease: "power3.out" }, 1.2);
      tl.from("#points", { opacity: 0, y: 40, duration: 0.7, ease: "power3.out" }, 2.2);
      tl.from("#cta", { opacity: 0, y: 30, duration: 0.6, ease: "power3.out" }, 3.2);
      tl.to("#cta", { opacity: 0, duration: 0.5, ease: "power2.in" }, 14.2);
      window.__timelines["tw-9x16-product"] = tl;
    </script>
  </body>
</html>
